<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hackathon SouJunior 2026</title>

  <!-- Docsify Core Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">

  <!-- SouJunior Custom Theme -->
  <link rel="stylesheet" href="theme.css">

  <!-- Dark mode -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"
        media="(prefers-color-scheme: dark)" data-group="addon" data-sheet="core-dark-auto" />

  <!-- Google Tag (gtag.js) - Google Analytics 4 & Google Ads -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MEASUREMENT_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // Configuração do Google Analytics 4 (Substitua 'G-MEASUREMENT_ID' pela sua chave, ex: G-ABC123XYZ)
    gtag('config', 'G-MEASUREMENT_ID');

    // Configuração do Google Ads (Substitua 'AW-CONVERSION_ID' pela sua chave, ex: AW-123456789)
    gtag('config', 'AW-CONVERSION_ID');
  </script>
</head>
<body class="loading">
  <div id="app">Carregando...</div>

  <script>
    window.$docsify = {
      name: 'Hackathon SouJunior',
      repo: 'https://github.com/SouJunior/hackathon',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: false,
      homepage: '0_index.md',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: 'auto',
      plugins: [
        function(hook, vm) {
          // Dispara page_view no GA4 / Google Ads a cada troca de página no Docsify (SPA)
          hook.doneEach(function() {
            if (typeof window.gtag === 'function') {
              window.gtag('event', 'page_view', {
                page_title: document.title,
                page_location: window.location.href,
                page_path: window.location.hash || '/'
              });
            }
          });
        }
      ]
    };
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>

  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
