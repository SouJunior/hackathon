  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=

<body class="loading">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-55Q4NJDJ"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div id="app">Carregando...</div>

  <script>
    window.dataLayer = window.dataLayer || [];

    window.$docsify = {
      name: 'Hackathon SouJunior',
      repo: 'https://github.com/SouJunior/hackathon',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: false,
      homepage: '0_index.md',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: 'auto',
      plugins: [
        function(hook, vm) {
          const eventMap = {
            '2_desafio_site_soujunior.tech': 'view_desafio',
            '3_regulamento_oficial_hackathon_soujunior': 'view_regulamento',
            '4_briefing_de_produto_novo_soujunior': 'view_briefing',
            '6_cronograma_sugerido_15_dias': 'view_cronograma',
            '8_submissao': 'view_submissao'
          };

          // Dispara eventos no GTM a cada troca de rota no Docsify (SPA)
          hook.doneEach(function() {
            const pagePath = window.location.hash.slice(1); // Remove o '#' inicial
            const data = {
              page_title: document.title,
              page_location: window.location.href,
              page_path: pagePath || '/'
            };

            // 1. Envia o pageview padrão
            window.dataLayer.push({ event: 'virtualPageview', ...data });

            // 2. Envia evento específico se a página for mapeada
            for (const pathFragment in eventMap) {
              if (pagePath.includes(pathFragment)) {
                window.dataLayer.push({ event: eventMap[pathFragment], ...data });
                break;
              }
            }

            // 3. Adiciona listener para o botão de inscrição
            // Usamos um pequeno timeout para garantir que o Docsify renderizou o conteúdo
            setTimeout(() => {
              const ctaButton = document.getElementById('cta-inscricao-form');
              if (ctaButton && !ctaButton.dataset.gtmListenerAttached) {
                ctaButton.addEventListener('click', () => {
                  window.dataLayer.push({ event: 'generate_lead' });
                });
                ctaButton.dataset.gtmListenerAttached = 'true';
              }
            }, 500);
          });
        }
      ]
    };
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>

  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
